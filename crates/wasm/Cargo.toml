[package]
name = "wardmap-wasm"
version = "0.1.0"
authors = ["Artem Rupasov <artemrupasov125@gmail.com>"]
edition = "2021"
description = "Browser clustering for Wardmap"
license = "MIT"
repository = "https://github.com/Rupas1k/wardmap"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
hdbscan-core = { path = "../hdbscan-core" }
ndarray = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
console_error_panic_hook = { version = "0.1", optional = true }
